

name: Ride Assist Rockstar 2.0 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Android Gradle wrapper not found."
            echo "Upload your Android project and Gradle wrapper first."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RideAssist-Rockstar-2.0-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
